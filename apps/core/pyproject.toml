[project]
name = "agent-director-core"
version = "0.1.0"
description = "Agent Control Plane Core Runtime"
requires-python = ">=3.11"
dependencies = [
    "agent-director-contracts",
    "pydantic>=2.0",
    "temporalio",
    "litellm",
    "mcp",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "watchdog",
    "httpx",
    "orjson",
    "pyyaml==6.0.3",
    "cachetools==7.2.1",
]

[project.scripts]
director = "director.main:main"

[tool.uv.sources]
agent-director-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["director", "unified_api", "orchestrator"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sandbox_exec".msg = "Do not import in-sandbox daemon code outside apps/sandbox-exec."
