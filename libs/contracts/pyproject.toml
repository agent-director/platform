[project]
name = "agent-director-contracts"
version = "0.1.0"
description = "Shared Pydantic v2 contract schemas across Agent Director services"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
