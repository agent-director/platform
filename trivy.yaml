# Unified repository and container security policy.
# Callers override --scanners (e.g. misconfig,secret for IaC vs vuln,secret for images).
exit-code: 1
severity:
  - HIGH
  - CRITICAL
cache-dir: .cache/trivy
vulnerability:
  ignore-unfixed: true
pkg-types:
  - os
  - library
scan:
  scanners:
    - vuln
    - misconfig
    - secret
  skip-dirs:
    - .cache
    - .claude
    - .mise
    - .nx
    - .venv
    - graphify-out
    - hack
    - node_modules
    - apps/ui/node_modules
    - apps/ui/.cache
    - apps/ui/.next
    - .git
