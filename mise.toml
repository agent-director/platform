# Root toolchain authority. Native metadata and image inputs are derived by scripts/toolchain.py.
min_version = "2026.10.8"

[tools]
python = "3.14.8"
node = "26.11.1"
uv = "0.12.23"
pnpm = "12.11.2"
prek = "0.5.5"
helm = "4.3.0"
kind = "0.33.0"
kubectl = "1.36.1"
jq = "1.8.2"
kubeconform = "0.8.0"
trivy = "0.75.0"
hadolint = "2.15.1"

[settings]
lockfile = true
python.uv_venv_auto = "source"
python.compile = false

[tool_config]
locked = true

[env]
PLATFORM_ROOT = "{{ config_root }}"
PLATFORM_MISE_ACTIVE = "1"
PLATFORM_CACHE_DIR = "{{ config_root }}/.cache"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
UV_PYTHON_DOWNLOADS = "never"
UV_PROJECT_ENVIRONMENT = "{{ config_root }}/.venv"
UV_CACHE_DIR = "{{ config_root }}/.cache/uv"
PREK_HOME = "{{ config_root }}/.cache/prek"
RUFF_CACHE_DIR = "{{ config_root }}/.cache/ruff"
PYTHONPYCACHEPREFIX = "{{ config_root }}/.cache/pycache"
TMPDIR = "{{ config_root }}/.cache/tmp"
TMP = "{{ config_root }}/.cache/tmp"
TEMP = "{{ config_root }}/.cache/tmp"
HELM_CACHE_HOME = "{{ config_root }}/.cache/helm/cache"
HELM_CONFIG_HOME = "{{ config_root }}/.cache/helm/config"
HELM_DATA_HOME = "{{ config_root }}/.cache/helm/data"
TRIVY_CACHE_DIR = "{{ config_root }}/.cache/trivy"
COVERAGE_FILE = "{{ config_root }}/.cache/coverage/.coverage"
pnpm_config_store_dir = "{{ config_root }}/.cache/pnpm/store"
pnpm_config_cache_dir = "{{ config_root }}/.cache/pnpm/cache"
pnpm_config_state_dir = "{{ config_root }}/.cache/pnpm/state"
XDG_CACHE_HOME = "{{ config_root }}/.cache/xdg"
XDG_RUNTIME_DIR = "{{ config_root }}/.cache/xdg-runtime"
MISE_CACHE_DIR = "{{ config_root }}/.cache/mise/cache"
MISE_STATE_DIR = "{{ config_root }}/.cache/mise/state"
MISE_DOWNLOADS_DIR = "{{ config_root }}/.cache/mise/downloads"
MISE_TMP_DIR = "{{ config_root }}/.cache/mise/tmp"
MISE_CONFIG_DIR = "{{ config_root }}/.cache/mise/config"
MISE_SYSTEM_CONFIG_DIR = "{{ config_root }}/.cache/mise/system"

# mise ignores [_]. Bootstrap hashes come from the immutable official release assets;
# image digests are multi-architecture indexes verified with docker buildx imagetools inspect.
[_]
mise_version = "2026.10.8"
mise_sha256_macos_arm64 = "dd77de9a7574e38d8409fb06fa85e1581415896639d075987791d8c4e5a57b73"
mise_sha256_macos_x64 = "a122fd04db5f2da07d24528ed61109bc82142ca44e821d4faafa05650f6ba627"
mise_sha256_linux_arm64 = "6ee0bd8173f1347514f4974d55fb1fae13aa7f6de0a55338adbefa0667cad7e5"
mise_sha256_linux_x64 = "c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428"

[_.images.uv]
repository = "ghcr.io/astral-sh/uv"
suffix = "-trixie-slim"
digest = "sha256:cb8750e12902fdaca60c1e48a796d19c02e6c2037ca801f322689fa97f0a44f2"

[_.images.node]
repository = "node"
suffix = "-trixie-slim"
digest = "sha256:193fe51b64e77981119c98c2002c9e32a70e2f006fb4d25068ce0558998917f0"

[_.images.pnpm]
repository = "ghcr.io/pnpm/pnpm"
suffix = ""
digest = "sha256:fd95b696aff515e5c58f59248435c29d783fce85cfc9a28c9db3b994bffa44dd"

[_.images.trivy]
repository = "aquasec/trivy"
suffix = ""
digest = "sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa"

[_.images.node_runtime]
# The base is hardened distroless; the frontend image copies the selected builder
# Node executable into /nodejs/bin/node to enforce the exact runtime selection.
repository = "gcr.io/distroless/nodejs{node_major}-debian13"
version = "nonroot"
digest = "sha256:a3bb283a564754266646d6029c5b6aa4f760b9415dae1398db8d7f8142ee1375"

[_.images.kind]
# kind's node image is a provider build, not the kind CLI version.
repository = "kindest/node"
version = "v1.37.0"
digest = "sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
