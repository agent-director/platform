global:
  image:
    tag: "latest"

fullnameOverride: ""

adminAllowlist:
  - "admin@example.com"

imagePullSecrets:
  - name: ghcr-secret

database:
  teamId: "agent-director"
  superuser: "agent-director-admin"
  version: "18"

minio:
  enabled: true
  image: "quay.io/minio/minio:RELEASE.2024-01-01T16-36-33Z"
  persistence:
    size: "10Gi"
gitSync:
  repo: "https://github.com/agent-director/platform.git"
  branch: "main"

secrets:
  langfuseNextauthSecret: "secret"
  langfuseSalt: "salt"

# Unprivileged Sidecar Bridge Ingress
tailscaleIngress:
  enabled: true
  image:
    repository: ghcr.io/agent-director/caddy-tailscale
    tag: RELEASE.2024-01-01T16-36-33Z
  hostname: "" # Dynamically generated via helper if left blank
  tailnet: ""  # Must be provided via --set or values override (e.g. from .env)
  ephemeral: false
  storage:
    size: 100Mi

  # The TS_AUTHKEY should be provided via secret:
  # kubectl create secret generic tailscale-auth --from-literal=TS_AUTHKEY=tskey-auth-xxxx
  secretName: tailscale-auth
  caddyConfig: |
    {
        tailscale {
            ephemeral {{ .Values.tailscaleIngress.ephemeral }}
        }
        servers {
            timeouts {
                read_body 120s
                read_header 5s
            }
            trusted_proxies static 127.0.0.1/8 ::1/128
        }
    }

    {{ include "platform.tailscaleHostname" . }}.{{ .Values.tailscaleIngress.tailnet }} {
        bind tailscale/{{ include "platform.tailscaleHostname" . }}
        tailscale_auth
        request_header X-Webauth-User {http.auth.user.tailscale_user}
        request_header X-Webauth-Name {http.auth.user.tailscale_name}
        request_header X-Webauth-Email {http.auth.user.tailscale_user}
        request_header X-Tailscale-Tailnet {http.auth.user.tailscale_tailnet}

        request_body {
            max_size 10MB
        }

        handle /* {
            reverse_proxy frontend:3000
        }
    }

unifiedApi:
  enabled: true
  replicaCount: 1
  image:
    repository: unified-api
    tag: local
    pullPolicy: IfNotPresent
  githubRepo: "YOUR_ORG/YOUR_CONFIG_REPO"
  service:
    port: 8000

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: frontend
    tag: local
    pullPolicy: IfNotPresent
  env:
    HOSTNAME: "0.0.0.0"
  service:
    port: 3000

litellm:
  enabled: true
  service:
    port: 4000

temporal:
  prometheus:
    enabled: false
  server:
    securityContext:
      runAsUser: null
      fsGroup: null
  admintools:
    securityContext:
      runAsUser: null
      fsGroup: null
  server:
    additionalVolumes:
      - name: temporal-scratch
        emptyDir:
          sizeLimit: 1Gi
    additionalVolumeMounts:
      - name: temporal-scratch
        mountPath: /var/lib/temporal

# OpenShift Sandboxed Containers (Kata) Operator
sandboxedContainers:
  enabled: true
  channel: "stable"
