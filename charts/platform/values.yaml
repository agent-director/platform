global:
  image:
    tag: "latest"
  tls:
    useOcpServingCert: false
fullnameOverride: ""

adminAllowlist:
  - "admin@example.com"

imagePullSecrets:
  - name: ghcr-secret

database:
  teamId: "agent-director"
  superuser: "agent-director-admin"
  version: "18"

rustfs:
  enabled: true
  image: "rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff"
  persistence:
    size: "10Gi"
  accessKey: "rustfsadmin"
  secretKey: "rustfsadmin" # pragma: allowlist secret
gitSync:
  repo: "https://github.com/agent-director/platform.git"
  branch: "main"

secrets:
  langfuseNextauthSecret: "secret"
  langfuseSalt: "salt"
  litellmMasterKey: "sk-local-dummy-key" # pragma: allowlist secret

# Unprivileged Sidecar Bridge Ingress
tailscaleIngress:
  enabled: true
  image:
    repository: ghcr.io/agent-director/caddy-tailscale
    tag: latest
  hostname: "" # Dynamically generated via helper if left blank
  tailnet: ""  # Must be provided via --set or values override (e.g. from .env)
  ephemeral: false
  storage:
    size: 100Mi

  # The TS_AUTHKEY should be provided via secret:
  # kubectl create secret generic tailscale-auth --from-literal=TS_AUTHKEY=tskey-auth-xxxx
  secretName: tailscale-auth

  caddyConfig: |
    {
        tailscale {
            ephemeral {{ .Values.tailscaleIngress.ephemeral }}
        }
        servers {
            timeouts {
                read_body 120s
                read_header 5s
            }
            trusted_proxies static 127.0.0.1/8 ::1/128
        }
    }

    {{ include "platform.tailscaleHostname" . }}.{{ .Values.tailscaleIngress.tailnet }} {
        bind tailscale/{{ include "platform.tailscaleHostname" . }}
        tailscale_auth
        request_header X-Webauth-User {http.auth.user.tailscale_user}
        request_header X-Webauth-Name {http.auth.user.tailscale_name}
        request_header X-Webauth-Email {http.auth.user.tailscale_user}
        request_header X-Tailscale-Tailnet {http.auth.user.tailscale_tailnet}

        request_body {
            max_size 10MB
        }

        handle /* {
            reverse_proxy frontend:3000
        }
    }

unifiedApi:
  enabled: true
  replicaCount: 1
  image:
    repository: unified-api
    tag: local
    pullPolicy: IfNotPresent
  githubRepo: "YOUR_ORG/YOUR_CONFIG_REPO"
  service:
    port: 8000

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: frontend
    tag: local
    pullPolicy: IfNotPresent
  env:
    HOSTNAME: "0.0.0.0"
  service:
    port: 3000

litellm:
  enabled: true
  service:
    port: 4000

temporal:
  cassandra:
    enabled: false
  elasticsearch:
    enabled: false
  prometheus:
    enabled: false
  postgresql:
    enabled: false
  mysql:
    enabled: false
  server:
    config:
      persistence:
        default:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: "platform-db"
            port: 5432
            database: "temporal"
            user: "temporal"
            existingSecret: "temporal.platform-db.credentials.postgresql.acid.zalan.do" # pragma: allowlist secret
        visibility:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: "platform-db"
            port: 5432
            database: "temporal_visibility"
            user: "temporal"
            existingSecret: "temporal.platform-db.credentials.postgresql.acid.zalan.do" # pragma: allowlist secret
    securityContext:
      runAsUser: null
      fsGroup: null
    additionalVolumes:
      - name: temporal-scratch
        emptyDir:
          sizeLimit: 1Gi
    additionalVolumeMounts:
      - name: temporal-scratch
        mountPath: /var/lib/temporal
  admintools:
    securityContext:
      runAsUser: null
      fsGroup: null

# OpenShift Sandboxed Containers (Kata) Operator# OpenShift Sandboxed Containers (Kata) Operator
# OpenShift Sandboxed Containers (Kata) Operator

sandboxedContainers:
  enabled: true
  channel: "stable"
  checkNodeEligibility: false

# Disable legacy Bitnami PostgreSQL subchart (we use Zalando Operator)
postgresql:
  enabled: false

# Temporarily disabled until Tier 0.15 Temporal V1 Migration
temporal:
  enabled: false
