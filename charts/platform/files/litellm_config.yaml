model_list:
  - model_name: "gpt-4o"
    litellm_params:
      model: "openai/gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"
      rpm: 500
      tpm: 100000
  - model_name: "claude-5-sonnet"
    litellm_params:
      model: "anthropic/claude-sonnet-5"
      api_key: "os.environ/ANTHROPIC_API_KEY"
  - model_name: "default-model"
    litellm_params:
      model: "openai/gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: "gpt-4-turbo-preview"
    litellm_params:
      model: "openai/gpt-4-turbo-preview"
      api_key: "os.environ/OPENAI_API_KEY"
      rpm: 500
      tpm: 100000
  - model_name: "gpt-3.5-turbo"
    litellm_params:
      model: "openai/gpt-3.5-turbo"
      api_key: "os.environ/OPENAI_API_KEY"

litellm_settings:
  # Enable Prometheus metrics
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

  custom_callbacks:
    - gateway.shunt_middleware.ShuntMiddleware

  # Explicitly disable caching to prevent agentic staleness
  cache: false

  # Define fallback chains
  fallbacks:
    - {"gpt-4o": ["claude-5-sonnet", "gpt-4-turbo-preview", "gpt-3.5-turbo"]}

  # Enable retry policies
  num_retries: 3
  request_timeout: 60
