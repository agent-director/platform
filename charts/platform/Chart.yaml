apiVersion: v2
name: platform
description: Unified multi-agent control plane
type: application
version: 0.1.1
appVersion: "1.0.0"
dependencies:
  - name: temporal
    version: 1.7.0
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
  - name: minio
    version: 12.10.4
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: victoria-metrics-single
    version: 0.13.0
    repository: https://victoriametrics.github.io/helm-charts/
    condition: victoriametrics.enabled
  - name: git-pkgs-proxy
    version: 0.1.0
    repository: oci://ghcr.io/gordon-control-plane
    condition: git-pkgs-proxy.enabled
