{{- $trustName := include "platform.databaseTrust" . -}}
{{- if .Values.global.tls.useOcpServingCert }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $trustName }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
data: {}
{{- else }}
{{- $secretName := include "platform.databaseTLSSecret" . }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $caCert := "" }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- if $secret }}
{{- $caCert = index $secret.data "ca.crt" | b64dec }}
{{- $tlsCert = index $secret.data "tls.crt" | b64dec }}
{{- $tlsKey = index $secret.data "tls.key" | b64dec }}
{{- else }}
{{- $name := include "platform.databaseName" . }}
{{- $ca := genCA (printf "%s-ca" $name) 3650 }}
{{- $cert := genSignedCert $name nil (list $name (printf "%s.%s" $name .Release.Namespace) (printf "%s.%s.svc" $name .Release.Namespace) (include "platform.databaseDNS" .)) 3650 $ca }}
{{- $caCert = $ca.Cert }}
{{- $tlsCert = $cert.Cert }}
{{- $tlsKey = $cert.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert | b64enc | quote }}
  tls.crt: {{ $tlsCert | b64enc | quote }}
  tls.key: {{ $tlsKey | b64enc | quote }}
---
# Only public trust is mounted/copied to consumers; database private key stays here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $trustName }}
data:
  ca.crt: {{ $caCert | quote }}
{{- end }}
