{{- if not .Values.tls.useOcpServingCert }}
{{- $secretName := "platform-db-tls" }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $caCert := "" }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- if $secret }}
{{- $caCert = index $secret.data "ca.crt" | b64dec }}
{{- $tlsCert = index $secret.data "tls.crt" | b64dec }}
{{- $tlsKey = index $secret.data "tls.key" | b64dec }}
{{- else }}
{{- $ca := genCA "platform-db-ca" 3650 }}
{{- $fullname := printf "%s-db" .Release.Name }}
{{- $cert := genSignedCert $fullname nil (list $fullname (printf "%s.%s.svc" $fullname .Release.Namespace) (printf "%s.%s.svc.cluster.local" $fullname .Release.Namespace)) 3650 $ca }}
{{- $caCert = $ca.Cert }}
{{- $tlsCert = $cert.Cert }}
{{- $tlsKey = $cert.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
type: Opaque
data:
  ca.crt: {{ $caCert | b64enc | quote }}
  tls.crt: {{ $tlsCert | b64enc | quote }}
  tls.key: {{ $tlsKey | b64enc | quote }}
{{- end }}
