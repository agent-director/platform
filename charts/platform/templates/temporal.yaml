{{- if .Values.temporal.enabled }}
{{- $temporalFullname := include "platform.temporalFullname" . -}}
{{- $temporalService := include "platform.temporalService" . -}}
{{- $temporalPort := include "platform.temporalPort" . | int -}}
{{- $dbDNS := include "platform.databaseDNS" . -}}
{{- $dbPort := .Values.database.port | int -}}
{{- $dbCredSecret := include "platform.databaseCredential" (dict "root" . "user" "temporal") -}}
{{- $serviceAccount := include "platform.temporalSchemaServiceAccount" . -}}
{{- $roles := include "platform.temporalRoles" . | fromJsonArray -}}
{{- $frontend := first $roles -}}
{{- $metricsPort := 9090 -}}
{{- $schemaStores := list
  (dict "name" "setup-default-store" "database" "temporal" "dir" "temporal")
  (dict "name" "setup-visibility-store" "database" "temporal_visibility" "dir" "visibility")
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $temporalFullname }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.temporalLabels" (dict "root" . "component" "server") | nindent 4 }}
data:
  config_template.yaml: |
    # enable-template
    log:
      stdout: true
      level: info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: {{ .Values.temporal.server.config.persistence.numHistoryShards }}
      datastores:
        default:
          sql:
            pluginName: postgres12
            databaseName: temporal
            connectAddr: {{ $dbDNS }}:{{ $dbPort }}
            connectProtocol: tcp
            user: temporal
            passwordCommand:
              command: /bin/printenv
              args:
                - TEMPORAL_DEFAULT_STORE_PASSWORD
            tls:
              enabled: true
              caFile: /etc/db-trust/ca.crt
              enableHostVerification: true
              serverName: {{ $dbDNS }}
        visibility:
          sql:
            pluginName: postgres12
            databaseName: temporal_visibility
            connectAddr: {{ $dbDNS }}:{{ $dbPort }}
            connectProtocol: tcp
            user: temporal
            passwordCommand:
              command: /bin/printenv
              args:
                - TEMPORAL_VISIBILITY_STORE_PASSWORD
            tls:
              enabled: true
              caFile: /etc/db-trust/ca.crt
              enableHostVerification: true
              serverName: {{ $dbDNS }}
    global:
      membership:
        name: temporal
        maxJoinDuration: 30s
        broadcastAddress: {{ `{{ env "POD_IP" | quote }}` }}
      pprof:
        port: 7936
      metrics:
        prometheus:
          timerType: histogram
          listenAddress: "0.0.0.0:{{ $metricsPort }}"
    services:
{{- range $role := $roles }}
      {{ $role.name }}:
        rpc:
{{- if gt (int $role.rpcPort) 0 }}
          grpcPort: {{ int $role.rpcPort }}
{{- end }}
          membershipPort: {{ int $role.membershipPort }}
          bindOnIP: "0.0.0.0"
{{- if gt (int $role.httpPort) 0 }}
          httpPort: {{ int $role.httpPort }}
{{- end }}
{{- end }}
    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "temporal-frontend"
          rpcAddress: "{{ $temporalService }}:{{ $temporalPort }}"
          httpAddress: "{{ $temporalService }}:{{ int $frontend.httpPort }}"
    dcRedirectionPolicy:
      policy: noop
    archival:
      history:
        state: disabled
      visibility:
        state: disabled
    publicClient:
      hostPort: "{{ $temporalService }}:{{ $temporalPort }}"
    dynamicConfigClient:
      filepath: "/etc/temporal/dynamic_config/dynamic_config.yaml"
      pollInterval: 60s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $temporalFullname }}-dynamic-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.temporalLabels" (dict "root" . "component" "server") | nindent 4 }}
data:
  dynamic_config.yaml: "{}\n"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $temporalService }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.temporalLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform.temporalLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: grpc-rpc
      port: {{ $temporalPort }}
      targetPort: rpc
      protocol: TCP
    - name: http
      port: {{ int $frontend.httpPort }}
      targetPort: http
      protocol: TCP
{{ range $role := $roles -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $temporalFullname }}-{{ $role.name }}-headless
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "platform.temporalLabels" (dict "root" $ "component" $role.name) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "platform.temporalLabels" (dict "root" $ "component" $role.name) | nindent 4 }}
  ports:
{{- if gt (int $role.rpcPort) 0 }}
    - name: grpc-rpc
      port: {{ int $role.rpcPort }}
      targetPort: rpc
      protocol: TCP
{{- end }}
    - name: membership
      port: {{ int $role.membershipPort }}
      targetPort: membership
      protocol: TCP
    - name: metrics
      port: {{ $metricsPort }}
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $temporalFullname }}-{{ $role.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "platform.temporalLabels" (dict "root" $ "component" $role.name) | nindent 4 }}
spec:
  replicas: {{ $.Values.temporal.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.temporalLabels" (dict "root" $ "component" $role.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.temporalLabels" (dict "root" $ "component" $role.name) | nindent 8 }}
      {{- with $.Values.temporal.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ $serviceAccount }}
      securityContext:
        {{- include "platform.temporalPodSecurityContext" $ | nindent 8 }}
      {{- with include "platform.temporalScheduling" $.Values.temporal.server | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: temporal-{{ $role.name }}
          image: "{{ $.Values.temporal.server.image.repository }}:{{ $.Values.temporal.server.image.tag }}"
          imagePullPolicy: {{ $.Values.temporal.server.image.pullPolicy }}
          securityContext:
            {{- include "platform.temporalContainerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.temporal.server.resources | nindent 12 }}
          ports:
{{- if gt (int $role.rpcPort) 0 }}
            - name: rpc
              containerPort: {{ int $role.rpcPort }}
              protocol: TCP
{{- end }}
{{- if gt (int $role.httpPort) 0 }}
            - name: http
              containerPort: {{ int $role.httpPort }}
              protocol: TCP
{{- end }}
            - name: membership
              containerPort: {{ int $role.membershipPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $metricsPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ $role.probePortName }}
            initialDelaySeconds: 15
          livenessProbe:
            tcpSocket:
              port: {{ $role.probePortName }}
            initialDelaySeconds: 150
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: TEMPORAL_SERVICES
              value: {{ $role.name | quote }}
            - name: TEMPORAL_SERVER_CONFIG_FILE_PATH
              value: /etc/temporal/config/config_template.yaml
            - name: HOME
              value: /tmp
            - name: USER
              value: temporal
            - name: TEMPORAL_DEFAULT_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbCredSecret }}
                  key: password
            - name: TEMPORAL_VISIBILITY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbCredSecret }}
                  key: password
          volumeMounts:
            - name: server-runtime-config
              mountPath: /etc/temporal/config
            - name: config
              mountPath: /etc/temporal/config/config_template.yaml
              subPath: config_template.yaml
            - name: dynamic-config
              mountPath: /etc/temporal/dynamic_config
              readOnly: true
            - name: db-trust
              mountPath: /etc/db-trust
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: server-runtime-config
          emptyDir:
            sizeLimit: 128Mi
        - name: config
          configMap:
            name: {{ $temporalFullname }}-config
        - name: dynamic-config
          configMap:
            name: {{ $temporalFullname }}-dynamic-config
        {{- include "platform.temporalDbTrustVolumes" $ | nindent 8 }}
{{ end -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $temporalFullname }}-schema-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.temporalLabels" (dict "root" . "component" "database") | nindent 4 }}
  annotations:
    {{- include "platform.temporalJobAnnotations" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: {{ .Values.temporal.schema.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.temporal.schema.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "platform.temporalLabels" (dict "root" . "component" "database") | nindent 8 }}
      {{- with .Values.temporal.schema.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      serviceAccountName: {{ $serviceAccount }}
      securityContext:
        {{- include "platform.temporalPodSecurityContext" . | nindent 8 }}
      {{- with include "platform.temporalScheduling" .Values.temporal.schema | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      initContainers:
{{- range $store := $schemaStores }}
        - name: {{ $store.name }}
          image: "{{ $.Values.temporal.admintools.image.repository }}:{{ $.Values.temporal.admintools.image.tag }}"
          imagePullPolicy: {{ $.Values.temporal.admintools.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # setup-schema treats a failed version read as 0.0 and overwrites the stored
              # version, so it only runs when the schema_version table or its version row
              # is missing (a fresh or interrupted first install).
              if out=$(temporal-sql-tool --database {{ $store.database }} update-schema -d /etc/temporal/schema/postgresql/v12/{{ $store.dir }}/versioned 2>&1); then
                printf '%s\n' "$out"
              else
                printf '%s\n' "$out" >&2
                case "$out" in
                  *schema_version*|*"no rows in result set"*)
                    temporal-sql-tool --database {{ $store.database }} setup-schema -v 0.0 && \
                    temporal-sql-tool --database {{ $store.database }} update-schema -d /etc/temporal/schema/postgresql/v12/{{ $store.dir }}/versioned
                    ;;
                  *) exit 1 ;;
                esac
              fi
          securityContext:
            {{- include "platform.temporalContainerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.temporal.schema.resources | nindent 12 }}
          env:
            - name: SQL_PLUGIN
              value: postgres12
            - name: SQL_HOST
              value: {{ $dbDNS | quote }}
            - name: SQL_PORT
              value: {{ $dbPort | quote }}
            - name: SQL_USER
              value: temporal
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbCredSecret }}
                  key: password
            - name: SQL_TLS
              value: "true"
            - name: SQL_TLS_CA_FILE
              value: /etc/db-trust/ca.crt
            - name: SQL_TLS_DISABLE_HOST_VERIFICATION
              value: "false"
            - name: SQL_TLS_SERVER_NAME
              value: {{ $dbDNS | quote }}
            - name: HOME
              value: /tmp
            - name: USER
              value: temporal
          volumeMounts:
            - name: db-trust
              mountPath: /etc/db-trust
              readOnly: true
            - name: scratch
              mountPath: /tmp
{{- end }}
      containers:
        - name: done
          image: "{{ .Values.temporal.admintools.image.repository }}:{{ .Values.temporal.admintools.image.tag }}"
          imagePullPolicy: {{ .Values.temporal.admintools.image.pullPolicy }}
          command: ["temporal-sql-tool", "--version"]
          securityContext:
            {{- include "platform.temporalContainerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.temporal.schema.resources | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: USER
              value: temporal
          volumeMounts:
            - name: db-trust
              mountPath: /etc/db-trust
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        {{- include "platform.temporalDbTrustVolumes" . | nindent 8 }}
{{ if .Values.temporal.server.config.namespaces.create -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $temporalFullname }}-namespace-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.temporalLabels" (dict "root" . "component" "database") | nindent 4 }}
  annotations:
    {{- include "platform.temporalJobAnnotations" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: {{ .Values.temporal.schema.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.temporal.schema.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "platform.temporalLabels" (dict "root" . "component" "database") | nindent 8 }}
      {{- with .Values.temporal.schema.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      serviceAccountName: {{ $serviceAccount }}
      securityContext:
        {{- include "platform.temporalPodSecurityContext" . | nindent 8 }}
      {{- with include "platform.temporalScheduling" .Values.temporal.schema | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: create-namespaces
          image: "{{ .Values.temporal.admintools.image.repository }}:{{ .Values.temporal.admintools.image.tag }}"
          imagePullPolicy: {{ .Values.temporal.admintools.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              temporal operator cluster health && (temporal operator namespace describe --namespace {{ .Values.workers.temporalNamespace | quote }} || temporal operator namespace create --namespace {{ .Values.workers.temporalNamespace | quote }} --retention {{ .Values.temporal.server.config.namespaces.retention | quote }})
          securityContext:
            {{- include "platform.temporalContainerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.temporal.schema.resources | nindent 12 }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ include "platform.temporalAddress" . | quote }}
            - name: HOME
              value: /tmp
            - name: USER
              value: temporal
          volumeMounts:
            - name: db-trust
              mountPath: /etc/db-trust
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        {{- include "platform.temporalDbTrustVolumes" . | nindent 8 }}
{{ end -}}
{{ end -}}
