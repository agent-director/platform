{{- if .Values.temporal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-workers
  labels:
    app: workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workers
  template:
    metadata:
      labels:
        app: workers
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: temporal-worker
          image: "{{ .Values.global.image.repository | default "ghcr.io/agent-director" }}/platform-worker:{{ .Values.global.image.tag | default "latest" }}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          env:
            - name: UNIFIED_API_URL
              value: 'http://{{ include "platform.fullname" . }}-caddy:8080'
            - name: TEMPORAL_URL
              value: '{{ .Release.Name }}-temporal-frontend:7233'
            - name: OPENAI_BASE_URL
              value: 'http://{{ include "platform.fullname" . }}-litellm:4000/v1'
            - name: LITELLM_URL
              value: 'http://{{ include "platform.fullname" . }}-litellm:4000/v1'
          command: ["python", "-m", "orchestrator.temporal_worker"]
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-workers-netpol
spec:
  podSelector:
    matchLabels:
      app: workers
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - podSelector:
            matchLabels:
              app: caddy-tailscale
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-substrate
      ports:
        - protocol: TCP
          port: 50051

{{- end }}
