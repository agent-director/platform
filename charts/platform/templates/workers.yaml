{{- if .Values.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.resourceName" (dict "root" . "component" "workers") }}
  labels:
    {{- include "platform.selectorLabels" (dict "root" . "component" "workers") | nindent 4 }}
spec:
  replicas: {{ .Values.workers.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "root" . "component" "workers") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" (dict "root" . "component" "workers") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-worker
          image: "{{ .Values.workers.image.repository }}:{{ .Values.workers.image.tag }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          command: ["python", "-m", "orchestrator.temporal_worker"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: health
              containerPort: {{ .Values.workers.health.port }}
          readinessProbe:
            httpGet:
              path: /ready
              port: health
          livenessProbe:
            httpGet:
              path: /health
              port: health
          startupProbe:
            httpGet:
              path: /health
              port: health
            failureThreshold: 60
            periodSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: WORKER_HEALTH_PORT
              value: {{ .Values.workers.health.port | quote }}
            - name: UNIFIED_API_URL
              value: {{ include "platform.httpURL" (dict "root" . "component" "unifiedApi") | quote }}
            - name: TEMPORAL_URL
              value: {{ include "platform.temporalAddress" . | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.workers.temporalNamespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.workers.taskQueue | quote }}
            - name: OPENAI_BASE_URL
              value: "{{ include "platform.httpURL" (dict "root" . "component" "litellm") }}/v1"
            - name: LITELLM_URL
              value: {{ include "platform.httpURL" (dict "root" . "component" "litellm") | quote }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.resourceName" (dict "root" . "component" "workers-netpol") }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "root" . "component" "workers") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # Kubelet probes are not subject to ingress NetworkPolicy.
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- if .Values.temporalDev.enabled }}
              {{- include "platform.selectorLabels" (dict "root" . "component" "temporal-dev") | nindent 14 }}
              {{- else }}
              app.kubernetes.io/name: {{ include "platform.temporalName" . | quote }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: frontend
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "platform.temporalPort" . }}
    {{- range $component := list "unifiedApi" "litellm" "langfuse" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" (dict "root" $ "component" (ternary "unified-api" $component (eq $component "unifiedApi"))) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "platform.port" (dict "root" $ "component" $component) }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.workers.substrateNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: ateapi
      ports:
        - protocol: TCP
          port: {{ .Values.workers.substratePort }}
{{- end }}
