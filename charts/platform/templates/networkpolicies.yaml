{{ if .Values.temporal.enabled -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.resourceName" (dict "root" . "component" "temporal-netpol") }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform.temporalName" . | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "platform.temporalName" . | quote }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: {{ include "platform.temporalPort" . }}
        - protocol: TCP
          port: 7234
        - protocol: TCP
          port: 7235
        - protocol: TCP
          port: 6933
        - protocol: TCP
          port: 6934
        - protocol: TCP
          port: 6935
        - protocol: TCP
          port: 6939
    {{- if or .Values.workers.enabled .Values.unifiedApi.enabled }}
    - from:
        {{- if .Values.workers.enabled }}
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" (dict "root" . "component" "workers") | nindent 14 }}
        {{- end }}
        {{- if .Values.unifiedApi.enabled }}
        - podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" (dict "root" . "component" "unified-api") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "platform.temporalPort" . }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cluster-name: {{ include "platform.databaseName" . | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "platform.temporalName" . | quote }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: {{ include "platform.temporalPort" . }}
        - protocol: TCP
          port: 7234
        - protocol: TCP
          port: 7235
        - protocol: TCP
          port: 6933
        - protocol: TCP
          port: 6934
        - protocol: TCP
          port: 6935
        - protocol: TCP
          port: 6939
{{ end -}}
