{{- if .Values.tailscaleIngress.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform.fullname" . }}-tailscale-data
  labels:
    app: tailscale-ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.tailscaleIngress.storage.size }}
{{- end }}
