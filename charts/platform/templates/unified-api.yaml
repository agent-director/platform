{{- if .Values.unifiedApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-unified-api
  labels:
    app: unified-api
spec:
  replicas: {{ .Values.unifiedApi.replicaCount }}
  selector:
    matchLabels:
      app: unified-api
  template:
    metadata:
      labels:
        app: unified-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: unified-api
          image: '{{ .Values.global.image.repository | default "ghcr.io/agent-director" }}/unified-api:{{ .Values.global.image.tag | default "latest" }}'
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s.%s-db.credentials.postgresql.acid.zalan.do" (.Values.database.superuser | default "agent-platform") .Release.Name | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s.%s-db.credentials.postgresql.acid.zalan.do" (.Values.database.superuser | default "agent-platform") .Release.Name | quote }}
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(PGUSER):$(PGPASSWORD)@{{ .Release.Name }}-db:5432/postgres"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.fullname" . }}-secrets
                  key: GITHUB_TOKEN
                  optional: true
            - name: GITHUB_REPO
              value: {{ .Values.unifiedApi.githubRepo | quote }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: admin-allowlist
              mountPath: /etc/unified-api
              readOnly: true
            - name: litellm-config
              mountPath: /app/gateway/litellm_config.yaml
              subPath: litellm_config.yaml
              readOnly: true
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: admin-allowlist
          configMap:
            name: admin-allowlist
        - name: litellm-config
          configMap:
            name: {{ include "platform.fullname" . }}-litellm-config

---
apiVersion: v1
kind: Service
metadata:
  name: unified-api
  labels:
    app: unified-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: unified-api
{{- end }}
