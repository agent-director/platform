{{- if .Values.caddyTailscale.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}-caddy-config
data:
  Caddyfile: |
{{ tpl .Values.caddyTailscale.caddyConfig . | indent 4 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-caddy-tailscale
  labels:
    app: caddy-tailscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caddy-tailscale
  template:
    metadata:
      labels:
        app: caddy-tailscale
      annotations:
        kube-linter.io/ignore-checks: "env-var-secret"
        checksum/config: {{ .Values.caddyTailscale.caddyConfig | sha256sum | quote }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: caddy
          image: "{{ .Values.caddyTailscale.image.repository }}:{{ .Values.caddyTailscale.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.caddyTailscale.secretName }}
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: {{ include "platform.tailscaleHostname" . | quote }}
            - name: TS_STATE_DIR
              value: /data/tailscale
            - name: XDG_CONFIG_HOME
              value: /data/caddy/config
            - name: XDG_DATA_HOME
              value: /data/caddy/data
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: tailscale-run
              mountPath: /tmp
            - name: data-volume
              mountPath: /data
          ports:
            - containerPort: 443
              protocol: TCP
          resources:
            requests:
              cpu: 10m
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "platform.fullname" . }}-tailscale-data
        - name: caddy-config
          configMap:
            name: {{ include "platform.fullname" . }}-caddy-config
        - name: tailscale-run
          emptyDir: {}
{{- end }}
