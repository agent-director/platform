{{- if .Values.caddyTailscale.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.resourceName" (dict "root" . "component" "caddy-config") }}
data:
  Caddyfile: |
{{ tpl .Values.caddyTailscale.caddyConfig . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.resourceName" (dict "root" . "component" "caddy-tailscale") }}
  labels:
    {{- include "platform.selectorLabels" (dict "root" . "component" "caddy-tailscale") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "root" . "component" "caddy-tailscale") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" (dict "root" . "component" "caddy-tailscale") | nindent 8 }}
      annotations:
        checksum/config: {{ tpl .Values.caddyTailscale.caddyConfig . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: "{{ .Values.caddyTailscale.image.repository }}:{{ .Values.caddyTailscale.image.tag }}"
          imagePullPolicy: {{ .Values.caddyTailscale.image.pullPolicy }}
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.caddyTailscale.secretName }}
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: {{ include "platform.tailscaleHostname" . | quote }}
            - name: TS_STATE_DIR
              value: /data/tailscale
            - name: XDG_CONFIG_HOME
              value: /data/caddy/config
            - name: XDG_DATA_HOME
              value: /data/caddy/data
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: scratch
              mountPath: /tmp
            - name: data
              mountPath: /data
          ports:
            - name: https
              containerPort: 443
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: health
          livenessProbe:
            httpGet:
              path: /health
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "platform.resourceName" (dict "root" . "component" "tailscale-data") }}
        - name: caddy-config
          configMap:
            name: {{ include "platform.resourceName" (dict "root" . "component" "caddy-config") }}
        - name: scratch
          emptyDir: {}
{{- end }}
