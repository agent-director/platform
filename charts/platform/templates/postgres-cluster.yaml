apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app: postgres
spec:
  teamId: "agent-director"
  volume:
    size: 10Gi
  numberOfInstances: 2
  users:
    agent-director:
      - superuser
      - createdb
    platform: []
    langfuse: []
    temporal: []
  databases:
    platform: platform
    langfuse: langfuse
    temporal: temporal
  postgresql:
    version: "15"
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 1Gi
