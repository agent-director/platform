apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app: postgres
spec:
  teamId: {{ .Values.database.teamId | quote }}
  volume:
    size: 10Gi
  numberOfInstances: 1
  users:
    {{ .Values.database.superuser }}:
      - superuser
      - createdb
    platform: []
    langfuse: []
    temporal: []
  databases:
    platform: platform
    langfuse: langfuse
    temporal: temporal
  postgresql:
    version: {{ .Values.database.version | quote }}
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 1Gi
