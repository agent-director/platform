apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app: postgres
spec:
  teamId: {{ .Values.database.teamId | quote }}
  {{- if .Values.tls.useOcpServingCert }}
  serviceAnnotations:
    service.beta.openshift.io/serving-cert-secret-name: "platform-db-tls"
  {{- end }}
  volume:
    size: 10Gi
  numberOfInstances: 1
  users:
    {{ .Values.database.superuser }}:
      - superuser
      - createdb
    platform: []
    langfuse: []
    temporal: []
  databases:
    platform: platform
    langfuse: langfuse
    temporal: temporal
    temporal_visibility: temporal
  postgresql:
    version: {{ .Values.database.version | quote }}
  tls:
    secretName: "platform-db-tls" # pragma: allowlist secret
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 1Gi
