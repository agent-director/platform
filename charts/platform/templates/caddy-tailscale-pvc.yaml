{{- if and .Values.caddyTailscale.enabled (not .Values.bootstrap.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform.resourceName" (dict "root" . "component" "tailscale-data") }}
  labels:
    app: caddy-tailscale
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.caddyTailscale.storage.size }}
{{- end }}
