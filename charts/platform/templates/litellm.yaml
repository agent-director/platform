{{- if or .Values.litellm.enabled .Values.unifiedApi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.resourceName" (dict "root" . "component" "litellm-config") }}
data:
  litellm_config.yaml: |
{{ .Files.Get "files/litellm_config.yaml" | indent 4 }}
{{- end }}
{{- if .Values.litellm.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.resourceName" (dict "root" . "component" "litellm") }}
  labels:
    {{- include "platform.selectorLabels" (dict "root" . "component" "litellm") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "root" . "component" "litellm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" (dict "root" . "component" "litellm") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - --config
            - /app/config/litellm_config.yaml
            - --port
            - {{ include "platform.port" (dict "root" . "component" "litellm") | quote }}
          ports:
            - name: http
              containerPort: {{ include "platform.port" (dict "root" . "component" "litellm") }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
          env:
            - name: LITELLM_MODE
              value: PRODUCTION
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - secretRef:
                name: {{ include "platform.resourceName" (dict "root" . "component" "secrets") }}
                optional: true
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: litellm-config
          configMap:
            name: {{ include "platform.resourceName" (dict "root" . "component" "litellm-config") }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.serviceName" (dict "root" . "component" "litellm") }}
spec:
  type: ClusterIP
  ports:
    - port: {{ include "platform.port" (dict "root" . "component" "litellm") }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "platform.selectorLabels" (dict "root" . "component" "litellm") | nindent 4 }}
{{- end }}
