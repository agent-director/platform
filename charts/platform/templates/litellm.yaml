{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}-litellm-config
data:
  litellm_config.yaml: |
{{ .Files.Get "files/litellm_config.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: "ghcr.io/berriai/litellm:main-latest"
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/config/litellm_config.yaml"
            - "--port"
            - "4000"
            - "--detailed_debug"
          ports:
            - containerPort: 4000
              protocol: TCP
          env:
            # Disable Admin UI
            - name: LITELLM_MODE
              value: "PRODUCTION"
          envFrom:
            - secretRef:
                name: {{ include "platform.fullname" . }}-secrets
                optional: true
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config
              readOnly: true
            - name: litellm-middleware
              mountPath: /app/gateway/shunt_middleware.py
              subPath: shunt_middleware.py
            - name: litellm-middleware
              mountPath: /app/gateway/__init__.py
              subPath: __init__.py
      volumes:
        - name: litellm-config
          configMap:
            name: {{ include "platform.fullname" . }}-litellm-config
        - name: litellm-middleware
          configMap:
            name: {{ include "platform.fullname" . }}-litellm-middleware
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-litellm
  labels:
    app: litellm
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: litellm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}-litellm-middleware
data:
  shunt_middleware.py: |
{{ .Files.Get "files/shunt_middleware.py" | indent 4 }}
  __init__.py: ""
{{- end }}
