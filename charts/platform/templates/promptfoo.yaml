{{- if .Values.promptfoo.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform.fullname" . }}-promptfoo-data
  labels:
    app: promptfoo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-promptfoo
  labels:
    app: promptfoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promptfoo
  template:
    metadata:
      labels:
        app: promptfoo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: promptfoo
          image: "ghcr.io/promptfoo/promptfoo:latest"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: promptfoo-data
              mountPath: /home/promptfoo/.promptfoo
          ports:
            - containerPort: 3000
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: promptfoo-data
          persistentVolumeClaim:
            claimName: {{ include "platform.fullname" . }}-promptfoo-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-promptfoo
spec:
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: promptfoo
{{- end }}
