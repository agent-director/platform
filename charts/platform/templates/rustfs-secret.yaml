{{- if .Values.rustfs.enabled }}
{{- $secretName := "rustfs-auth-secret" -}}
{{- $accessKey := .Values.rustfs.accessKey | default "rustfsadmin" -}}
{{- $secretKey := .Values.rustfs.secretKey | default (randAlphaNum 32) -}} # pragma: allowlist secret
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if $existingSecret -}}
  {{- $accessKey = index $existingSecret.data "accessKey" | b64dec -}}
  {{- $secretKey = index $existingSecret.data "secretKey" | b64dec -}} # pragma: allowlist secret
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app: rustfs
type: Opaque
stringData:
  accessKey: {{ $accessKey | quote }}
  secretKey: {{ $secretKey | quote }}
{{- end }}
