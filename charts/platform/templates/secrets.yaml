apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-langfuse-secret
type: Opaque
stringData:
  nextauth-secret: {{ .Values.secrets.langfuseNextauthSecret | quote }}
  salt: {{ .Values.secrets.langfuseSalt | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-secrets
  labels:
    app: platform
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.secrets.litellmMasterKey | quote }}
