apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform.fullname" . }}-omnigent-workspace
  labels:
    app: omnigent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-omnigent
  labels:
    app: omnigent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnigent
  template:
    metadata:
      labels:
        app: omnigent
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: omnigent
          image: "ghcr.io/agent-director/interactive-agent:{{ .Values.global.image.tag | default "latest" }}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
            - name: git-repo
              mountPath: /git
              readOnly: true
          env:
            - name: MCP_SERVER_URL
              value: "http://{{ include "platform.fullname" . }}-mcp:8080"
        - name: git-sync
          image: "registry.k8s.io/git-sync/git-sync:v4.2.0"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: git-repo
              mountPath: /git
          env:
            - name: GIT_SYNC_REPO
              value: {{ .Values.gitSync.repo | quote }}
            - name: GIT_SYNC_BRANCH
              value: {{ .Values.gitSync.branch | quote }}
            - name: GIT_SYNC_ROOT
              value: "/git"
            - name: GIT_SYNC_DEST
              value: "repo"
            - name: GIT_SYNC_PERIOD
              value: "60"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "platform.fullname" . }}-omnigent-workspace
        - name: git-repo
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
