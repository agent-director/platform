---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-substrate-sa
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-substrate-role
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["ate.dev"]
  resources: ["workerpools", "sandboxconfigs", "actortemplates"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-substrate-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-substrate-role
subjects:
- kind: ServiceAccount
  name: agent-substrate-sa
  namespace: {{ .Release.Namespace }}

---
# Bind to OpenShift privileged SCC for atelet
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-substrate-scc-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: agent-substrate-sa
  namespace: {{ .Release.Namespace }}
- kind: ServiceAccount
  name: agent-substrate-workload-sa
  namespace: {{ .Release.Namespace }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-substrate-workload-sa
  namespace: {{ .Release.Namespace }}
