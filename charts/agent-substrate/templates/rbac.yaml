---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.workloadNamespace }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-substrate.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-substrate.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent-substrate.fullname" . }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["ate.dev"]
  resources: ["workerpools", "workerpools/status", "workerpools/finalizers", "sandboxconfigs", "actortemplates"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent-substrate.fullname" . }}-controller
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-substrate.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "agent-substrate.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent-substrate.fullname" . }}-pod
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-substrate.fullname" . }}-api
  namespace: {{ .Values.workloadNamespace }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-substrate.fullname" . }}-pod
subjects:
- kind: ServiceAccount
  name: {{ include "agent-substrate.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
