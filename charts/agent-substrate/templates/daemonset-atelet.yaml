{{- if .Values.atelet.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: atelet
spec:
  selector:
    matchLabels:
      {{- include "agent-substrate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: atelet
  template:
    metadata:
      labels:
        {{- include "agent-substrate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: atelet
      annotations:
        checkov.io/skip1: "CKV_K8S_43=Image digest is managed by Helm"
        checkov.io/skip2: "CKV_K8S_14=Image tag is managed by Helm"
        checkov.io/skip3: "CKV_K8S_21=Default namespace is handled dynamically by Helm"
        checkov.io/skip4: "CKV_K8S_38=SA token required"
        checkov.io/skip5: "CKV_K8S_35=Secrets as env vars allowed"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-substrate-sa
      hostPID: true

      {{- with .Values.atelet.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.atelet.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.atelet.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: atelet
        image: "{{ .Values.atelet.image.repository }}:{{ .Values.atelet.image.tag | default .Values.global.image.tag | default "latest" }}"
        imagePullPolicy: {{ .Values.atelet.image.pullPolicy | default "IfNotPresent" }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        command: ["/usr/local/bin/atelet"]
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        args:
        - --ateapi-address=ateapi:50051
        - --gcp-auth-for-image-pulls=false
        - --ateapi-ca-file=/etc/tls/bundle.pem
        - --grpc-server-cred-bundle=/etc/tls/bundle.pem
        - --client-ca-certs=/etc/tls/bundle.pem
        - --ateapi-server-name=ateapi
        resources:
          {{- toYaml .Values.atelet.resources | nindent 10 }}

        readinessProbe:
          tcpSocket:
            port: 9090
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: ATE_STORAGE_BACKEND
          value: "s3"
        - name: AWS_ENDPOINT_URL_S3
          value: {{ printf "http://minio.%s.svc.cluster.local:9000" .Release.Namespace | quote }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-auth-secret
              key: rootUser
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-auth-secret
              key: rootPassword
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        volumeMounts:
        - name: ateom-gvisor
          mountPath: /var/lib/ateom-gvisor
        - name: kubelet-plugins
          mountPath: /var/lib/kubelet/plugins
        - name: kubelet-device-plugins
          mountPath: /var/lib/kubelet/device-plugins
        - name: host-dev
          mountPath: /host/dev
          readOnly: true
        - name: tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: ateom-gvisor
        hostPath:
          path: /var/lib/ateom-gvisor
          type: DirectoryOrCreate
      - name: kubelet-plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
      - name: kubelet-device-plugins
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      - name: tls
        secret:
          secretName: agent-substrate-tls # pragma: allowlist secret
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: substrate/templates/daemonset-netpol
  labels:
    app.kubernetes.io/component: substrate/templates/daemonset
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: substrate/templates/daemonset
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
  egress:
  - to:
    - namespaceSelector: {}
