{{- if .Values.atelet.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: atelet
spec:
  selector:
    matchLabels:
      {{- include "agent-substrate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: atelet
  template:
    metadata:
      labels:
        {{- include "agent-substrate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: atelet
    spec:
      serviceAccountName: agent-substrate-sa
      nodeSelector:
        ate.dev/substrate-version: "true"
      hostPID: true
      containers:
      - name: atelet
        image: "{{ .Values.image.repository }}/atelet:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        env:
        - name: ATEAPI_ADDRESS
          value: "ateapi:50051"
        - name: ATEAPI_INSECURE
          value: "true"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: host-var-run
          mountPath: /var/run
        - name: host-sys
          mountPath: /sys
          readOnly: true
      volumes:
      - name: host-var-run
        hostPath:
          path: /var/run
      - name: host-sys
        hostPath:
          path: /sys
{{- end }}
