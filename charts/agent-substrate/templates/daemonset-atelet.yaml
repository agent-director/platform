{{- if .Values.atelet.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: atelet
spec:
  selector:
    matchLabels:
      {{- include "agent-substrate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: atelet
  template:
    metadata:
      labels:
        {{- include "agent-substrate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: atelet
      annotations:
        checkov.io/skip1: "CKV_K8S_16=DaemonSet fundamentally requires privileged container access to map gVisor/Kata sandbox configurations"
        checkov.io/skip2: "CKV_K8S_17=DaemonSet requires host PID namespace to inspect and manage node-level sandbox processes"
        checkov.io/skip3: "CKV_K8S_20=allowPrivilegeEscalation is required for the node daemon to assume sysadmin permissions"
        checkov.io/skip4: "CKV_K8S_22=DaemonSet requires write access to the host filesystem to provision /var/lib/kubelet plugins"
        checkov.io/skip5: "CKV_K8S_23=runAsNonRoot cannot be enforced; DaemonSet must execute as root to manage node resources"
        checkov.io/skip6: "CKV_K8S_28=NET_RAW capability cannot be dropped; required for sandbox network interface manipulation"
        checkov.io/skip7: "CKV_K8S_31=RuntimeDefault seccomp profile restricts syscalls needed by the node agent to provision sandbox environments"
        checkov.io/skip8: "CKV_K8S_37=Cannot drop ALL capabilities; DaemonSet requires elevated host capabilities to configure container runtimes"
        checkov.io/skip9: "CKV_K8S_40=runAsUser must be exactly 0 (root); cannot run as a high unprivileged UID"
        checkov.io/skip10: "CKV_K8S_19=Host network namespace access is required to bridge sandbox configurations with node networking"
        checkov.io/skip11: "CKV_K8S_29=Standard restricted security contexts conflict with the DaemonSet's requirement to operate as a host-level system agent"
        checkov.io/skip12: "CKV_K8S_39=CAP_SYS_ADMIN is explicitly required to mount sandbox volumes and modify namespace configurations"
        checkov.io/skip13: "CKV_K8S_38=Service Account Token automounting is required for the agent to authenticate with the Kubernetes API"
        checkov.io/skip14: "CKV_K8S_35=Storing AWS credentials as environment variables is an accepted pattern for this feasibility spike"
        checkov.io/skip15: "CKV2_K8S_6=NetworkPolicy skip"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-substrate-sa
      hostPID: true

      {{- with .Values.atelet.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.atelet.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.atelet.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: atelet
        image: "{{ .Values.atelet.image.repository }}:{{ .Values.atelet.image.tag | default .Values.global.image.tag | default "latest" }}"
        imagePullPolicy: {{ .Values.atelet.image.pullPolicy | default "IfNotPresent" }}
        command: ["/usr/local/bin/atelet"]
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        args:
        - --ateapi-address=ateapi:50051
        - --gcp-auth-for-image-pulls=false
        - --ateapi-ca-file=/etc/tls/bundle.pem
        - --grpc-server-cred-bundle=/etc/tls/bundle.pem
        - --client-ca-certs=/etc/tls/bundle.pem
        - --ateapi-server-name=ateapi
        resources:
          {{- toYaml .Values.atelet.resources | nindent 10 }}

        readinessProbe:
          tcpSocket:
            port: 9090
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: ATE_STORAGE_BACKEND
          value: "s3"
        - name: AWS_ENDPOINT_URL_S3
          value: {{ printf "http://minio.%s.svc.cluster.local:9000" .Release.Namespace | quote }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-auth-secret
              key: rootUser
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-auth-secret
              key: rootPassword
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        volumeMounts:
        - name: ateom-gvisor
          mountPath: /var/lib/ateom-gvisor
        - name: kubelet-plugins
          mountPath: /var/lib/kubelet/plugins
        - name: kubelet-device-plugins
          mountPath: /var/lib/kubelet/device-plugins
        - name: host-dev
          mountPath: /host/dev
          readOnly: true
        - name: tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: ateom-gvisor
        hostPath:
          path: /var/lib/ateom-gvisor
          type: DirectoryOrCreate
      - name: kubelet-plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
      - name: kubelet-device-plugins
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      - name: tls
        secret:
          secretName: agent-substrate-tls # pragma: allowlist secret
{{- end }}
