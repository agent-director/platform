{{- if .Values.gvisor.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent-substrate-gvisor
  namespace: {{ .Release.Namespace }}
  labels:
    app: gvisor-installer
spec:
  selector:
    matchLabels:
      app: gvisor-installer
  template:
    metadata:
      labels:
        app: gvisor-installer
    spec:
      hostPID: true
      serviceAccountName: agent-substrate-sa
      containers:
      - name: installer
        image: registry.access.redhat.com/ubi9/ubi:latest
        securityContext:
          privileged: true
        command:
        - /bin/bash
        - -c
        - |
          set -e
          # Ensure necessary tools are present
          dnf install -y tar bzip2 || true
          
          echo "Downloading gVisor..."
          ARCH=$(uname -m)
          URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}"
          
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          
          curl -sSL -o gvisor.tar.bz2 "${URL}/gvisor.tar.bz2"
          curl -sSL -o gvisor.tar.bz2.sha512 "${URL}/gvisor.tar.bz2.sha512"
          
          echo "Verifying checksum..."
          sha512sum -c gvisor.tar.bz2.sha512
          
          echo "Extracting..."
          tar -xjf gvisor.tar.bz2 -C /host/usr/local/bin
          
          cd /
          rm -rf "$WORKDIR"

          echo "Writing CRI-O config..."
          mkdir -p /host/etc/crio/crio.conf.d
          echo '[crio.runtime.runtimes.runsc]' > /host/etc/crio/crio.conf.d/99-runsc.conf
          echo 'runtime_path = "/usr/local/bin/runsc"' >> /host/etc/crio/crio.conf.d/99-runsc.conf
          echo 'runtime_type = "oci"' >> /host/etc/crio/crio.conf.d/99-runsc.conf
          echo 'runtime_root = "/run/runsc"' >> /host/etc/crio/crio.conf.d/99-runsc.conf

          echo "Reloading CRI-O..."
          chroot /host systemctl reload crio

          echo "Done. Sleeping forever."
          sleep infinity
        volumeMounts:
        - name: host
          mountPath: /host
      volumes:
      - name: host
        hostPath:
          path: /
          type: Directory
{{- end }}
