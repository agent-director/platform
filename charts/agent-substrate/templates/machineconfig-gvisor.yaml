{{- if .Values.machineConfig.enabled }}
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
    {{- include "agent-substrate.labels" . | nindent 4 }}
  name: 50-gvisor
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
      - path: /etc/crio/crio.conf.d/99-runsc.conf
        mode: 0644
        overwrite: true
        contents:
          source: data:,%5Bcrio.runtime.runtimes.runsc%5D%0Aruntime_path%20%3D%20%22/usr/local/bin/runsc%22%0Aruntime_type%20%3D%20%22oci%22%0Aruntime_root%20%3D%20%22/run/runsc%22%0A
    systemd:
      units:
      - name: gvisor-installer.service
        enabled: true
        contents: |
          [Unit]
          Description=Download and install gVisor (runsc)
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=!/usr/local/bin/runsc

          [Service]
          Type=oneshot
          ExecStartPre=/usr/bin/mkdir -p /usr/local/bin
          ExecStart=/bin/sh -c 'VERSION={{ .Values.gvisor.version | default "20240422.0" }}; ARCH={{ default "x86_64" .Values.arch }}; curl -sSL -o /usr/local/bin/runsc https://storage.googleapis.com/gvisor/releases/release/${VERSION}/${ARCH}/runsc'
          ExecStartPost=/bin/sh -c 'EXPECTED_SHA512="{{ .Values.gvisor.sha512 }}"; if [ -n "$EXPECTED_SHA512" ]; then echo "$EXPECTED_SHA512 /usr/local/bin/runsc" | sha512sum -c -; else VERSION={{ .Values.gvisor.version | default "20240422.0" }}; ARCH={{ default "x86_64" .Values.arch }}; curl -sSL -o /usr/local/bin/runsc.sha512 https://storage.googleapis.com/gvisor/releases/release/${VERSION}/${ARCH}/runsc.sha512 && cd /usr/local/bin && sha512sum -c runsc.sha512; fi'
          ExecStartPost=/usr/bin/chmod +x /usr/local/bin/runsc
          ExecStartPost=/usr/bin/systemctl reload crio
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
{{- end }}
