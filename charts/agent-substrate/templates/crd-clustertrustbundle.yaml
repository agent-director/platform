# WORKAROUND: upstream v0.3.0 attempts to watch certificates.k8s.io/v1beta1 ClusterTrustBundle
# In some k8s versions, this API is missing or disabled, causing controller-runtime WaitForCacheSync to hang forever.
# We create a dummy CRD to satisfy the informer and unblock startup.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustertrustbundles.certificates.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, workaround for informer deadlock"
spec:
  group: certificates.k8s.io
  names:
    kind: ClusterTrustBundle
    listKind: ClusterTrustBundleList
    plural: clustertrustbundles
    singular: clustertrustbundle
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
