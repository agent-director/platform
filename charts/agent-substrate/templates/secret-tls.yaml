{{- if and (not .Values.global.tls.useOcpServingCert) (not .Values.tls.existingBundleSecret) }}
{{- $data := include "agent-substrate.tlsData" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-substrate.tlsSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
