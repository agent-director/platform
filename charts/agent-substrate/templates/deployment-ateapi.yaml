apiVersion: apps/v1
kind: Deployment
metadata:
  name: ateapi
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: ateapi
spec:
  replicas: {{ .Values.ateapi.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-substrate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ateapi
  template:
    metadata:
      labels:
        {{- include "agent-substrate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ateapi
    spec:
      containers:
      - name: ateapi
        image: "{{ .Values.image.repository }}/ateapi:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        args:
        - "--grpc-listen-addr=:50051"
        - "--postgres-connection-string=$(POSTGRES_URL)"
        - "--grpc-server-cred-bundle=/etc/tls/bundle.pem"
        - "--authentication-config=/etc/tls/auth.yaml"
        - "--actor-id-ca-pool=/etc/tls/bundle.pem"
        - "--actor-id-jwt-pool=/etc/tls/jwt.pem"
        ports:
        - containerPort: 50051
          name: grpc
        env:
        - name: ATE_STORAGE_BACKEND
          value: "s3"
        - name: AWS_ENDPOINT_URL_S3
          value: {{ .Values.minio.endpoint | quote }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: agent-substrate-secrets
              key: minio-accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: agent-substrate-secrets
              key: minio-secretKey
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: agent-substrate-secrets
              key: postgres-password
        - name: POSTGRES_URL
          value: {{ .Values.postgres.url | quote }}
        volumeMounts:
        - name: tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: agent-substrate-tls # pragma: allowlist secret
---
apiVersion: v1
kind: Service
metadata:
  name: ateapi
spec:
  selector:
    {{- include "agent-substrate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ateapi
  ports:
  - port: 50051
    targetPort: 50051
    name: grpc
