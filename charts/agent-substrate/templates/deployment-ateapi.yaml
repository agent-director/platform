apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agent-substrate.apiService" . }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: ateapi
spec:
  replicas: {{ .Values.ateapi.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-substrate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ateapi
  template:
    metadata:
      {{- if and (not .Values.global.tls.useOcpServingCert) (not .Values.tls.existingBundleSecret) }}
      annotations:
        checksum/tls: {{ include "agent-substrate.tlsData" . | sha256sum }}
      {{- end }}
      labels:
        {{- include "agent-substrate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ateapi
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "agent-substrate.fullname" . }}-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      {{- with .Values.ateapi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ateapi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ateapi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: ateapi
        image: "{{ .Values.ateapi.image.repository }}:{{ .Values.ateapi.image.tag | default .Values.global.image.tag | default "latest" }}"
        imagePullPolicy: {{ .Values.ateapi.image.pullPolicy | default "Always" }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          {{- toYaml .Values.ateapi.resources | nindent 10 }}
        args:
        - "--grpc-listen-addr=0.0.0.0:{{ include "agent-substrate.apiPort" . }}"
        - "--postgres-connection-string=$(POSTGRES_URL)"
        - "--grpc-server-cred-bundle=/etc/tls/bundle.pem"
        - "--pod-identity-ca-certs=/etc/tls/ca.crt"
        - "--authentication-config=/etc/tls/auth.yaml"
        - "--actor-id-ca-pool=/etc/tls/empty.json"
        - "--actor-id-jwt-pool=/etc/tls/empty.json"
        readinessProbe:
          tcpSocket:
            port: {{ include "agent-substrate.apiPort" . }}
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: {{ include "agent-substrate.apiPort" . }}
          initialDelaySeconds: 5
          periodSeconds: 10
        ports:
        - containerPort: {{ include "agent-substrate.apiPort" . }}
          name: grpc
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        - name: ATE_STORAGE_BACKEND
          value: "s3"
        - name: AWS_ENDPOINT_URL_S3
          value: {{ printf "http://%s.%s.svc.cluster.local:%v" (.Values.rustfs.host | default "rustfs") .Values.platformNamespace (.Values.rustfs.port | default 9000) | quote }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.rustfs.secretName | quote }}
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.rustfs.secretName | quote }}
              key: secretKey
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "agent-substrate.databaseCredential" . | quote }}
              key: password
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ include "agent-substrate.databaseCredential" . | quote }}
              key: username
        # pgx reads PGPASSWORD directly; upstream logs this DSN/flag at startup.
        - name: POSTGRES_URL
          value: "postgres://$(PGUSER)@{{ include "agent-substrate.databaseDNS" . }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=verify-full&sslrootcert=/etc/db-trust/ca.crt&connect_timeout=10"
        volumeMounts:
        - name: sa-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: tls
          mountPath: /etc/tls
          readOnly: true
        - name: db-trust
          mountPath: /etc/db-trust
          readOnly: true
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: tls
          secret:
            secretName: {{ include "agent-substrate.credentialSecret" . }}
            items:
              - key: bundle.pem
                path: bundle.pem
              - key: ca.crt
                path: ca.crt
              - key: auth.yaml
                path: auth.yaml
              - key: empty.json
                path: empty.json
        - name: db-trust
          configMap:
            name: {{ .Values.database.trustConfigMap | quote }}
            items:
              - key: {{ .Values.database.trustKey | quote }}
                path: ca.crt

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agent-substrate.apiService" . }}
  annotations:
    {{- if .Values.global.tls.useOcpServingCert }}
    service.beta.openshift.io/serving-cert-secret-name: {{ include "agent-substrate.tlsSecret" . | quote }}
    {{- end }}
spec:
  selector:
    {{- include "agent-substrate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ateapi
  ports:
  - port: {{ include "agent-substrate.apiPort" . }}
    targetPort: grpc
    name: grpc

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-substrate.apiService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: ateapi
spec:
  podSelector:
    matchLabels:
      {{- include "agent-substrate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ateapi
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agent-substrate.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: atecontroller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformNamespace }}
          podSelector:
            matchLabels:
              app: workers
      ports:
        - protocol: TCP
          port: {{ include "agent-substrate.apiPort" . }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformNamespace }}
          podSelector:
            matchLabels:
              cluster-name: {{ .Values.database.host }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platformNamespace }}
          podSelector:
            matchLabels:
              app: rustfs
      ports:
        - protocol: TCP
          port: {{ .Values.rustfs.port }}
    {{- $apiPeers := include "agent-substrate.apiServerEgress" . }}
    {{- if $apiPeers }}
    - to:
{{ $apiPeers | indent 8 }}
      ports:
        {{- range .Values.global.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
