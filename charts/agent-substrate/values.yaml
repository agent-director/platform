image:
  repository: ghcr.io/gordon-control-plane
  tag: latest
  pullPolicy: IfNotPresent

ateapi:
  replicaCount: 1

atecontroller:
  replicaCount: 1

atelet:
  enabled: true


postgres:
  url: "postgres://postgres:password@postgres-db.gordon.svc.cluster.local:5432/postgres" # pragma: allowlist secret

minio:
  endpoint: "http://minio.gordon.svc.cluster.local:9000"
  accessKey: "minioadmin"
  secretKey: "minioadmin" # pragma: allowlist secret
