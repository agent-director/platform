global:
  image:
    tag: latest

# OpenShift Sandboxed Containers (Kata) Operator
sandboxedContainers:
  enabled: true
  channel: "stable"

ateapi:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/ateapi
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

atecontroller:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/atecontroller
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  host: "platform-db"

tls:
  create: true
  secretName: agent-substrate-tls # pragma: allowlist secret
