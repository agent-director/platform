global:
  image:
    tag: latest

ateapi:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/ateapi
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

atecontroller:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/atecontroller
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

atelet:
  enabled: true
  image:
    repository: ghcr.io/agent-director/atelet
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  host: "platform-db"

tls:
  create: true
  secretName: agent-substrate-tls # pragma: allowlist secret
