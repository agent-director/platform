global:
  image:
    tag: latest


ateapi:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/ateapi
    pullPolicy: Always
  database:
    host: "platform-db"
  minio:
    secretName: "minio-auth-secret" # pragma: allowlist secret
    host: "minio"
    port: 9000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

atecontroller:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/atecontroller
    pullPolicy: Always
  database:
    host: "platform-db"
  minio:
    secretName: "minio-auth-secret" # pragma: allowlist secret
    host: "minio"
    port: 9000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  host: "platform-db"

tls:
  secretName: agent-substrate-tls # pragma: allowlist secret

platformNamespace: platform

workloadNamespace: agent-workloads
