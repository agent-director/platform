global:
  image:
    tag: local
  apiServerCIDRs: []
  # Include Service and translated endpoint listener ports (kind defaults).
  apiServerPorts: [443, 6443]
  tls:
    useOcpServingCert: false

ateapi:
  replicaCount: 1
  service:
    port: 50051
  image:
    repository: ghcr.io/agent-director/ateapi
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

atecontroller:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/atecontroller
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  host: platform-db
  port: 5432
  user: agent_substrate
  name: agent_substrate
  credentialSecret: "" # Defaults to the scoped operator-generated role secret.
  trustConfigMap: platform-db-trust
  trustKey: ca.crt

rustfs:
  secretName: "platform-rustfs-auth" # pragma: allowlist secret
  host: "platform-rustfs"
  port: 9000

tls:
  secretName: "" # Defaults to the release-derived serving TLS Secret.
  # OCP's two-key serving Secret is insufficient for upstream bundle/auth flags.
  # Supply a preassembled Secret with bundle.pem, ca.crt, auth.yaml, empty.json.
  # bundle.pem: PKCS#8 PRIVATE KEY, leaf certificate, then CA certificates.
  existingBundleSecret: ""

platformNamespace: platform

workloadNamespace: agent-workloads
