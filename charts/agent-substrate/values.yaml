image:
  repository: ghcr.io/gordon-control-plane
  tag: latest
  pullPolicy: IfNotPresent

ateapi:
  replicaCount: 1

atecontroller:
  replicaCount: 1

atelet:
  enabled: true


minio:
  endpoint: "http://minio.gordon.svc.cluster.local:9000"
tls:
  create: true
  secretName: agent-substrate-tls # pragma: allowlist secret
