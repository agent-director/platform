global:
  image:
    tag: latest


ateapi:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/ateapi
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

atecontroller:
  replicaCount: 1
  image:
    repository: ghcr.io/agent-director/atecontroller
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  host: "platform-db"

rustfs:
  secretName: "rustfs-auth-secret" # pragma: allowlist secret
  host: "rustfs"
  port: 9000

tls:
  secretName: agent-substrate-tls # pragma: allowlist secret

platformNamespace: platform

workloadNamespace: agent-workloads
