# Installed as the independent postgres-operator release in the platform namespace.
postgres-operator:
  image:
    pullPolicy: Always
  configGeneral:
    # Version-matched CRDs are packaged in this wrapper and applied before startup.
    enable_crd_registration: false
  configKubernetes:
    enable_readiness_probe: true
    # Spilo's postgres identity needs group access to the operator's 0640 TLS mount.
    spilo_runasuser: 101
    spilo_runasgroup: 103
    spilo_fsgroup: 103
  resources:
    requests:
      cpu: 100m
      memory: 250Mi
    limits:
      cpu: 500m
      memory: 500Mi
  securityContext:
    runAsUser: 10001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
