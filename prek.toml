# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
default_install_hook_types = ["pre-commit", "pre-push"]

# Priority tiers:
#   0 = fast whitespace/EOF auto-fixers
#   1 = code formatters/autofixers (ruff)
#   2 = all read-only linters, typechecks, schema/security checks, and unit tests in parallel
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace", priority = 0 },
  { id = "end-of-file-fixer", priority = 0 },
  { id = "check-yaml", args = ["--allow-multiple-documents"], exclude = "^charts/.*", priority = 2 },
  { id = "check-json", priority = 2 },
  { id = "check-toml", priority = 2 },
  { id = "check-added-large-files", args = ["--maxkb=1000"], priority = 2 },
  { id = "check-merge-conflict", priority = 2 },
  { id = "detect-private-key", priority = 2 },
]

# CLI tools are version-locked in mise.toml and executed from the active mise environment.
[[repos]]
repo = "local"
hooks = [
  { id = "ruff", name = "ruff", entry = "ruff check --fix", language = "system", types = ["python"], priority = 1 },
  { id = "ruff-format", name = "ruff format", entry = "ruff format", language = "system", types = ["python"], priority = 1 },
  { id = "gitleaks", name = "Detect hardcoded secrets", entry = "gitleaks git --pre-commit --staged --redact --config .gitleaks.toml", language = "system", pass_filenames = false, always_run = true, priority = 2 },
  { id = "actionlint", name = "Lint GitHub Actions workflow files", entry = "actionlint", language = "system", files = "^\\.github/workflows/.*\\.ya?ml$", priority = 2 },
  { id = "hadolint", name = "Lint Dockerfiles", entry = "hadolint", language = "system", files = "Dockerfile", priority = 2 },
  { id = "checkov", name = "Checkov", entry = "make lint-checkov", language = "system", files = "^(charts/|\\.checkov\\.yaml$)", pass_filenames = false, priority = 2 },
  { id = "kube-linter", name = "KubeLinter", entry = "make lint-kubernetes", language = "system", files = "^(charts/|\\.kube-linter\\.yaml$)", pass_filenames = false, priority = 2 },
  { id = "typecheck", name = "Whole-project Pyrefly", entry = "make typecheck", language = "system", types = ["python"], pass_filenames = false, always_run = true, priority = 2 },
  { id = "actions-lock", name = "GH Actions Lock", entry = "gh actions-lock --no-migrate-local-actions", language = "system", files = "^\\.github/workflows/", pass_filenames = false, priority = 2 },
  { id = "check-helm-deps", name = "Check Helm Deps", entry = "make check-helm-deps", language = "system", files = "^charts/", pass_filenames = false, priority = 2 },
  { id = "helm-lint", name = "Helm Lint", entry = "make lint-helm", language = "system", files = "^charts/", pass_filenames = false, priority = 2 },
  { id = "kubeconform", name = "Kubeconform", entry = "make check-schema", language = "system", files = "^(charts/|\\.schemas/)", pass_filenames = false, priority = 2 },
  { id = "trivy-fs", name = "Trivy IaC", entry = "make scan-iac", language = "system", stages = ["pre-push", "manual"], pass_filenames = false, priority = 2 },
  { id = "trivy-ci-parity", name = "Trivy CI Parity (Build+RootFS)", entry = "make scan-local", language = "system", stages = ["pre-push", "manual"], pass_filenames = false, priority = 2 },
  { id = "pytest", name = "Run Unit Tests", entry = "make pytest-unit PYTEST_ARGS='-n 0'", language = "system", pass_filenames = false, priority = 2 },
]
