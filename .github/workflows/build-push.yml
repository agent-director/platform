# This workflow is managed by gh actions-lock.

name: Build and Push Images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  setup:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Warm and cache Trivy vulnerability databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Ensure Trivy vulnerability databases are current
        run: |
          mise exec -- trivy image --config trivy.yaml --download-db-only
          mise exec -- trivy image --config trivy.yaml --download-java-db-only

      - name: Discover exported runtime images
        id: set-matrix
        run: |
          MATRIX=$(make -s image-matrix)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/_build-scan-push.yml
    with:
      dockerfile: ${{ matrix.component.path }}
      target: ${{ matrix.component.target }}
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
      push_image: ${{ github.event_name != 'pull_request' }}
