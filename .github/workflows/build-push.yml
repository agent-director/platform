# This workflow is managed by gh actions-lock.

name: Build and Push Images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  setup:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install locked toolchain
        run: ./scripts/mise.sh install --locked

      - name: Discover exported runtime images
        id: set-matrix
        run: |
          MATRIX=$(./scripts/mise.sh exec -- uv run --no-project scripts/images.py --format matrix)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/_build-scan-push.yml
    with:
      dockerfile: ${{ matrix.component.path }}
      target: ${{ matrix.component.target }}
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
      push_image: ${{ github.event_name != 'pull_request' }}
