name: Build and Push Images

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: set-matrix
        run: |
          # Initialize an empty JSON array
          COMPONENTS="[]"

          # Find images/*/Dockerfile
          for df in images/*/Dockerfile; do
            if [ -f "$df" ]; then
              dir_path=$(dirname "$df")
              name=$(basename "$dir_path")
              COMPONENTS=$(echo "$COMPONENTS" | jq --arg n "$name" --arg p "$df" '. += [{"name": $n, "path": $p}]')
            fi
          done

          echo "Generated matrix: $COMPONENTS"
          echo "matrix={\"component\":$(echo "$COMPONENTS" | jq -c .)}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    uses: ./.github/workflows/_build-scan-push.yml
    with:
      dockerfile: ${{ matrix.component.path }}
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
