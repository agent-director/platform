# This workflow is managed by gh actions-lock.

name: Infra CI & Security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  scan-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.1.2
        with:
          install: false

      - name: Set up project dependencies
        run: make setup

      - name: Install gh-actions-lock extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.1.6

      - name: Run commit gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint

      - name: Build frontend
        run: make build-frontend

      - name: Run infrastructure security gate
        run: make scan-iac

  kind-integration:
    runs-on: ubuntu-latest
    needs: scan-and-lint
    environment: e2e-tests
    env:
      CLUSTER_NAME: platform-ci-${{ github.run_id }}-${{ github.run_attempt }}
      GH_USER: ${{ github.actor }}
      GH_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.1.2
        with:
          install: false

      - name: Set up project dependencies
        run: make setup

      - name: Create owned kind cluster
        run: make cluster-up

      - name: Run kind integration
        run: make test-integration
