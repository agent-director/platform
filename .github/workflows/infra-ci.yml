# This workflow is managed by gh actions-lock.

name: Infra CI & Security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Pushes to main only seed the Nx task cache that pull requests restore.
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  scan-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Cache project dependencies and tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/uv
            .cache/pnpm
            .cache/prek
            .cache/helm
            .cache/trivy
          key: project-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml', 'prek.toml') }}
          restore-keys: |
            project-cache-${{ runner.os }}-

      - name: Cache Nx task results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/nx
          key: nx-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ runner.os }}-

      - name: Set up project dependencies
        run: make setup

      - name: Install gh-actions-lock extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.1.6

      - name: Run Nx gates (lint, format, typecheck, test, build)
        run: make nx-ci

      - name: Run remaining commit gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-residual

      - name: Run infrastructure security gate
        run: make scan-iac

  kind-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: scan-and-lint
    environment: e2e-tests
    env:
      CLUSTER_NAME: platform-ci-${{ github.run_id }}-${{ github.run_attempt }}
      GH_USER: ${{ github.actor }}
      GH_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Cache project dependencies and tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/uv
            .cache/pnpm
            .cache/prek
            .cache/helm
            .cache/trivy
          key: project-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml', 'prek.toml') }}
          restore-keys: |
            project-cache-${{ runner.os }}-

      - name: Set up project dependencies
        run: make setup

      - name: Create owned kind cluster
        run: make cluster-up

      - name: Run kind integration
        run: make test-integration
