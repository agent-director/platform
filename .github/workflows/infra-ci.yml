name: Infra CI & Security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  enforce-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for mixed Dockerfile and source changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-isolation-check') }}
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD)
          HAS_DOCKERFILE=0
          HAS_OTHER=0
          for file in $CHANGED_FILES; do
            if [[ "$file" == *"Dockerfile"* ]]; then
              HAS_DOCKERFILE=1
            else
              HAS_OTHER=1
            fi
          done

          if [ "$HAS_DOCKERFILE" -eq 1 ] && [ "$HAS_OTHER" -eq 1 ]; then
            echo "::error::PR mixes Dockerfile changes with other source code!"
            echo "To ensure CI checks are valid and based on images already built, Dockerfile updates should be in their own PR."
            echo "If necessary, add the \`skip-isolation-check\` label to this PR to bypass this rule."
            exit 1
          fi
          echo "Isolation check passed."

  scan-and-lint:
    needs: enforce-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get Date for Cache
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy Database
        uses: actions/cache@v3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-

      - name: Install System Dependencies
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://get.helm.sh/helm-v3.14.3-linux-amd64.tar.gz | tar -xzf - -C ~/.local/bin --strip-components=1 linux-amd64/helm
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xzf - -C ~/.local/bin kubeconform
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz | tar -xzf - -C ~/.local/bin trivy

      - name: Environment Setup
        env:
          GH_USER: ${{ github.actor }}
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install uv
          make setup

      - name: Run Pytest
        run: uv run pytest tests/

      - name: Run Prek (Commit Hooks)
        run: uvx prek run --all-files

      - name: Run Prek (Pre-Push Hooks - Trivy IaC)
        run: uvx prek run trivy-fs --all-files

  kind-integration:
    runs-on: ubuntu-latest
    needs: scan-and-lint
    environment: e2e-tests
    env:
      GH_USER: ${{ github.actor }}
      GH_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Helm natively
        run: |
          # renovate: datasource=github-releases depName=helm/helm
          HELM_VERSION="v3.22.0"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -zxvf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Set up Kind natively
        run: |
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          KIND_VERSION="v0.24.0"
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create k8s Kind Cluster via Makefile
        run: make cluster-up

      - name: Export Cluster URL
        run: |
          echo "KUBE_API_URL=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" >> "$GITHUB_ENV"

      - name: Install uv
        run: pip install uv

      - name: Run Integration Suite
        run: make test-integration
