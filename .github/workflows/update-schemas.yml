# This workflow is managed by gh actions-lock.

name: Auto-Update CRD Schemas

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.1.2

      - name: Set up project dependencies
        run: make setup

      - name: Update version-matched schemas and CRDs
        run: make update-schemas

      - name: Create draft schema pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add .schemas/ charts/agent-substrate/crds/
          if git diff --cached --quiet; then
            echo 'Pinned provider artifacts are unchanged.'
            exit 0
          fi
          BRANCH_NAME="chore/auto-update-schemas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH_NAME"
          git commit -m "$(cat <<'EOF'
          chore(scripts): updates version-matched CRD schemas
          EOF
          )"
          git push -u origin HEAD
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --draft \
            --title 'chore(scripts): updates version-matched CRD schemas' \
            --body "## Summary
          - Refresh CRDs and validation schemas from the selected, pinned providers."
