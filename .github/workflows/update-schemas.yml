# This workflow is managed by gh actions-lock.

name: Auto-Update CRD Schemas

on:
  workflow_dispatch: # Allow manual triggering from the GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Update Schemas
        run: make update-schemas

      - name: Create Pull Request via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No schema changes detected. Exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="chore/auto-update-schemas"
          git checkout -b "$BRANCH_NAME"
          git add .schemas/
          git commit -m "chore(ci): update cached CRD schemas"
          git push -f origin "$BRANCH_NAME"

          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq 'length')

          if [ "$PR_EXISTS" -eq 0 ]; then
            gh pr create \
              --title "chore(ci): auto-update cached CRD schemas" \
              --body "Automated PR generated by the \`update-schemas\` workflow. This updates the local \`.schemas/\` cache with the latest upstream CRD definitions, ensuring \`kubeconform\` validation remains accurate." \
              --label "dependencies"
          else
            echo "PR already exists for $BRANCH_NAME. Branch updated."
          fi
