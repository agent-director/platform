name: Auto-Update CRD Schemas

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight
  workflow_dispatch: # Allow manual triggering from the GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Update Schemas
        run: make update-schemas

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ci): update cached CRD schemas"
          title: "chore(ci): auto-update cached CRD schemas"
          body: |
            Automated PR generated by the `update-schemas` workflow.
            This updates the local `.schemas/` cache with the latest upstream CRD definitions, ensuring `kubeconform` validation remains accurate.
          branch: "chore/auto-update-schemas"
          delete-branch: true
          labels: "dependencies, automated pr"
