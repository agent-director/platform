# This workflow is managed by gh actions-lock.

name: Auto-Update CRD Schemas

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Cache project dependencies and tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/uv
            .cache/pnpm
            .cache/prek
            .cache/helm
          key: project-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml', 'prek.toml') }}
          restore-keys: |
            project-cache-${{ runner.os }}-

      - name: Set up project dependencies
        run: make setup

      - name: Update version-matched schemas and CRDs
        run: make update-schemas

      - name: Create draft schema pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add .schemas/ charts/agent-substrate/crds/
          if git diff --cached --quiet; then
            echo 'Pinned provider artifacts are unchanged.'
            exit 0
          fi
          BRANCH_NAME="chore/auto-update-schemas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH_NAME"
          git commit -m "$(cat <<'EOF'
          chore(scripts): updates version-matched CRD schemas
          EOF
          )"
          git push -u origin HEAD
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --draft \
            --title 'chore(scripts): updates version-matched CRD schemas' \
            --body "## Summary
          - Refresh CRDs and validation schemas from the selected, pinned providers."
