name: Reusable Build, Scan, and Push

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 1: Build and load into local daemon (NOT pushed yet)
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          tags: ${{ inputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      # Step 2: Run Trivy against the local daemon image (Dual-Pass Strategy)
      - name: 📦 Trivy App Dependencies (Enforcement)
        uses: aquasecurity/trivy-action@master # v0.29.0
        with:
          image-ref: ${{ inputs.image }}:${{ github.sha }}
          format: 'table'
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
        env:
          TRIVY_SKIP_DB_UPDATE: "false"
          TRIVY_JAVA_SKIP_UPDATE: "false"

      - name: ⚠️ Trivy OS Dependencies (Warning)
        uses: aquasecurity/trivy-action@master # v0.29.0
        with:
          image-ref: ${{ inputs.image }}:${{ github.sha }}
          format: 'table'
          vuln-type: 'os'
          severity: 'HIGH'
          exit-code: '0'
        env:
          TRIVY_SKIP_DB_UPDATE: "false"
          TRIVY_JAVA_SKIP_UPDATE: "false"

      - name: 🛑 Trivy OS Dependencies (Enforcement)
        uses: aquasecurity/trivy-action@master # v0.29.0
        with:
          image-ref: ${{ inputs.image }}:${{ github.sha }}
          format: 'table'
          vuln-type: 'os'
          severity: 'CRITICAL'
          exit-code: '1'
        env:
          TRIVY_SKIP_DB_UPDATE: "false"
          TRIVY_JAVA_SKIP_UPDATE: "false"

      # Step 3: Trivy passed. Now push the exact same image to GHCR.
      # Buildx natively uses the cached layers from the step above.
      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image }}:${{ github.sha }}
          # Keep caching enabled here so it picks up the previous run instantly
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
