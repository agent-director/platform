# This workflow is managed by gh actions-lock.

name: Reusable Build, Scan, and Push

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image:
        required: true
        type: string
      target:
        required: false
        type: string
        default: ''
      push_image:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: inputs.push_image
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          load: true
          push: false
          tags: ${{ inputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      - name: Scan built image
        env:
          IMAGE_REF: ${{ inputs.image }}:${{ github.sha }}
        run: make scan-image

      - name: Push scanned image
        if: inputs.push_image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: true
          tags: ${{ inputs.image }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
