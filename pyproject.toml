[project]
name = "agent-director"
version = "0.1.0"
description = "Agent Control Plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio",
    "litellm",
    "mcp",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "watchdog",
    "httpx",
    "orjson",
    "sniffio>=1.3.1",
    "pyyaml>=6.0.3",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
director = "director.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov==7.1.0",
    "pre-commit",
    "locust",
    "kubernetes",
    "types-PyYAML"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
norecursedirs = ["tests/integration", "tests/e2e"]
timeout = 30
markers = [
    "e2e: End-to-end tests requiring a Kubernetes cluster",
    "quarantine: Flaky tests temporarily quarantined from failing CI",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["director", "gateway", "orchestrator"]
