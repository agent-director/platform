[project]
name = "agent-director"
version = "0.1.0"
description = "Two-Plane multi-agent control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio",
    "langgraph",
    "litellm",
    "langgraph-checkpoint-postgres",
    "mcp",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "watchdog",
    "httpx",
    "orjson",
    "sniffio>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "pre-commit",
    "locust",
    "kubernetes",
    "types-PyYAML"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]

[project.scripts]
director = "director.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["director", "gateway", "orchestrator"]
