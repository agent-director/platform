[project]
name = "gordon-control-plane"
version = "0.1.0"
description = "One-Plane multi-agent control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio",
    "litellm",
    "mcp",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "watchdog",
    "httpx",
    "orjson",
    "pyyaml>=6.0.3",
    "pytest-timeout>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "pre-commit",
    "locust",
    "kubernetes",
    "types-PyYAML"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = [
    "e2e: End-to-end tests requiring a Kubernetes cluster",
]
