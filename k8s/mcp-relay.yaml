apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-relay
  namespace: agent-director
  labels:
    app: mcp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-relay
  template:
    metadata:
      labels:
        app: mcp-relay
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp-relay
          image: "ghcr.io/wgordon17/relay:latest"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          ports:
            - containerPort: 9000
          env:
            - name: TEMPORAL_URL
              value: "platform-temporal-frontend.agent-director.svc.cluster.local:7233"
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-relay
  namespace: agent-director
spec:
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: mcp-relay
